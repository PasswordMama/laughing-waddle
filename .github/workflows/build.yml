name: Build from ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No .zip file found in the repo. Upload your project zip first."
            exit 1
          fi
          echo "Using $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src

      - name: Find project folder
        id: proj
        run: |
          POM=$(find _src -name pom.xml | head -n 1)
          if [ -z "$POM" ]; then
            echo "No pom.xml found inside the zip."
            exit 1
          fi
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"

      - name: Build jar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: mvn -B package

      - name: Collect jar
        run: |
          mkdir -p out
          JAR=$(find "${{ steps.proj.outputs.dir }}/target" -maxdepth 1 -name '*.jar' -not -name 'original-*' | head -n 1)
          cp "$JAR" out/CaneIslands.jar

      - name: Upload jar (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CaneIslands
          path: out/CaneIslands.jar

      - name: Publish jar as a Release (plain .jar download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CaneIslands build ${{ github.run_number }}
          files: out/CaneIslands.jar
