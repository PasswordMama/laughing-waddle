name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Upload jar (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CaneIslands
          path: target/CaneIslands.jar

      - name: Publish jar as a Release (plain .jar download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CaneIslands build ${{ github.run_number }}
          files: target/CaneIslands.jar
